name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
  PROJECT_DIR: /srv/errandboy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull code and start background build
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            echo "=== Pulling latest code ==="
            cd ${{ env.PROJECT_DIR }}
            git fetch origin main
            PREV_COMMIT=$(git rev-parse HEAD)
            git reset --hard origin/main
            NEW_COMMIT=$(git rev-parse HEAD)

            echo "=== Checking if a full hermes rebuild is needed ==="
            # A heavy rebuild (apt install + hermes install.sh) only happens when the
            # Dockerfile changes (pinned HERMES_COMMIT / CACHE_BUSTER / base image /
            # apt deps). Light changes (entrypoint, plugins, docs) reuse the cache.
            # When the heavy path is taken, prune the build cache FIRST so a full
            # rebuild does not overflow the disk (a 15GB cache + fresh layers
            # previously caused "no space left on device").
            if git diff --name-only "$PREV_COMMIT" "$NEW_COMMIT" -- Dockerfile | grep -q .; then
              echo "Dockerfile changed (full rebuild) - pruning docker build cache"
              docker builder prune -f
            else
              echo "Dockerfile unchanged - reusing build cache"
            fi

            echo "=== Starting background build ==="
            # Run build detached so the SSH session can close without killing it.
            # Log to a file; exit code captured for the poll step to detect failure.
            rm -f /tmp/errandboy-build.log /tmp/errandboy-build.exit
            nohup setsid bash -c 'cd ${{ env.PROJECT_DIR }} && docker compose build errandboy > /tmp/errandboy-build.log 2>&1; echo $? > /tmp/errandboy-build.exit' > /dev/null 2>&1 &
            echo "Build started in background (pid $!)"

      - name: Wait for build to finish
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 60m
          script: |
            set -e
            echo "=== Waiting for background build ==="
            for i in $(seq 1 120); do
              if [ -f /tmp/errandboy-build.exit ]; then
                break
              fi
              sleep 15
            done

            if [ ! -f /tmp/errandboy-build.exit ]; then
              echo "ERROR: build did not finish within 30 minutes" >&2
              exit 1
            fi

            BUILD_EXIT=$(cat /tmp/errandboy-build.exit)
            echo "=== Build finished with exit code $BUILD_EXIT ==="
            if [ "$BUILD_EXIT" != "0" ]; then
              echo "=== Build log (last 50 lines) ==="
              tail -50 /tmp/errandboy-build.log
              echo "ERROR: docker build failed" >&2
              exit 1
            fi

      - name: Restart services and cleanup
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            echo "=== Restarting services ==="
            cd ${{ env.PROJECT_DIR }}
            docker compose up -d --force-recreate errandboy

            echo "=== Deploy complete ==="
            docker compose ps
