name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
  PROJECT_DIR: /srv/errandboy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull code and start background build
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            echo "=== Pulling latest code ==="
            cd ${{ env.PROJECT_DIR }}
            git fetch origin main
            git reset --hard origin/main

            echo "=== Preparing a full hermes rebuild ==="
            # Builds are deliberately cache-free: the hermes install layer must
            # re-download and re-install on every deploy, so --no-cache is used
            # below (a stale cached layer once shipped an image without the hermes
            # binary). Prune the builder cache FIRST, because the disk peak happens
            # during the build (cache + previous image + fresh layers) and
            # previously caused "no space left on device".
            docker builder prune -f

            echo "=== Starting background build ==="
            # Run build detached so the SSH session can close without killing it.
            # Log to a file; exit code captured for the poll step to detect failure.
            rm -f /tmp/errandboy-build.log /tmp/errandboy-build.exit
            nohup setsid bash -c 'cd ${{ env.PROJECT_DIR }} && docker compose build --no-cache errandboy > /tmp/errandboy-build.log 2>&1; echo $? > /tmp/errandboy-build.exit' > /dev/null 2>&1 &
            echo "Build started in background (pid $!)"

      - name: Wait for build to finish
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 60m
          script: |
            set -e
            echo "=== Waiting for background build ==="
            for i in $(seq 1 120); do
              if [ -f /tmp/errandboy-build.exit ]; then
                break
              fi
              sleep 15
            done

            if [ ! -f /tmp/errandboy-build.exit ]; then
              echo "ERROR: build did not finish within 30 minutes" >&2
              exit 1
            fi

            BUILD_EXIT=$(cat /tmp/errandboy-build.exit)
            echo "=== Build finished with exit code $BUILD_EXIT ==="
            if [ "$BUILD_EXIT" != "0" ]; then
              echo "=== Build log (last 50 lines) ==="
              tail -50 /tmp/errandboy-build.log
              echo "ERROR: docker build failed" >&2
              exit 1
            fi

      - name: Restart services and cleanup
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            echo "=== Restarting services ==="
            cd ${{ env.PROJECT_DIR }}
            docker compose up -d --force-recreate errandboy

            echo "=== Verifying the new container came up ==="
            # Recreating the container is what turns the PREVIOUS image into a
            # dangling one. Only prune after the new container is actually running,
            # otherwise the old image is our rollback path and must stay on disk.
            if [ "$(docker inspect -f '{{.State.Running}}' errandboy 2>/dev/null)" != "true" ]; then
              echo "ERROR: errandboy is not running after recreate - keeping the previous image" >&2
              docker logs --tail 50 errandboy || true
              exit 1
            fi

            echo "=== Cleaning up the replaced image and unused cache ==="
            # The disk peak happens DURING the build (old + new image coexist), so
            # this cannot prevent a mid-build ENOSPC; it prevents stale errandboy
            # images (~7.9GB each) from accumulating deploy after deploy.
            docker image prune -f
            docker builder prune -f

            echo "=== Deploy complete ==="
            docker compose ps
