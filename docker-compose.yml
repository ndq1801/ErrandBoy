services:
  postgres:
    image: postgres:17-alpine
    container_name: errandboy_postgres
    environment:
      POSTGRES_USER: finlog_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: finlogbot_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finlog_user -d finlogbot_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  errandboy:
    build: .
    container_name: errandboy
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://finlog_user:${POSTGRES_PASSWORD:-changeme}@postgres:5432/finlogbot_db
      # git's global config lives in the persistent hermes volume so the gh
      # credential helper setup survives --force-recreate.
      - GIT_CONFIG_GLOBAL=${HERMES_HOME}/.gitconfig
    volumes:
      - hermes_data:${HERMES_HOME}
      - /usr/bin/rclone:/usr/bin/rclone:ro
      - /root/.config/rclone:/root/.config/rclone
      - vault_data:${OBSIDIAN_VAULT_PATH}
      - projects_data:${DEV_PROJECTS_PATH}
      # Small, purpose-driven persistent mounts (NOT the whole home — /root stays
      # ephemeral so image rebuilds are never shadowed by stale volume content).
      # Agent-installed mutable state lives here and survives --force-recreate.
      - gh_config_data:/root/.config/gh
      - rclone_bisync_data:/root/.cache/rclone/bisync
      # Persistent CLI tool directory: the agent installs long-lived tools
      # here (${TOOLS_ROOT}/bin, first on PATH). Survives --force-recreate.
      - /srv/errandboy/tools:${TOOLS_ROOT}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  hermes_data:
  vault_data:
  projects_data:
  gh_config_data:
  rclone_bisync_data:
