services:
  postgres:
    image: postgres:17-alpine
    container_name: errandboy_postgres
    environment:
      POSTGRES_USER: finlog_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: finlogbot_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finlog_user -d finlogbot_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  errandboy:
    build: .
    container_name: errandboy
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://finlog_user:${POSTGRES_PASSWORD:-changeme}@postgres:5432/finlogbot_db
    volumes:
      - hermes_data:/root/.hermes
      - /usr/bin/rclone:/usr/bin/rclone:ro
      - /root/.config/rclone:/root/.config/rclone
      - vault_data:/root/obsidian-vault
      - projects_data:/root/projects
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  hermes_data:
  vault_data:
  projects_data:
